<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demscore Hex Map</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <aside id="controls">
        <h1 class="app-title">
          <img
            src="./assets/images/demscore-logo.svg"
            alt="Demscore Hex Map"
            width="200"
            height="50"
          />
        </h1>

        <section id="mobileControls" class="mobile-controls" aria-label="Mobile map controls">
          <button
            id="mobileVariablePickerBtn"
            type="button"
            class="mobile-picker-trigger"
            aria-haspopup="dialog"
            aria-controls="mobileVariablePickerDialog"
          >
            <span id="mobileSelectedDataset" class="mobile-selected-dataset"></span>
            <span class="mobile-selected-copy">
              <span id="mobileSelectedTitle" class="mobile-selected-title"></span>
              <span id="mobileSelectedMeta" class="mobile-selected-meta"></span>
            </span>
            <i data-lucide="chevron-down" aria-hidden="true"></i>
          </button>

          <div class="mobile-action-row" aria-label="Variable actions">
            <button id="mobileVariableInfoBtn" type="button" class="mobile-action-button">
              <i data-lucide="info" aria-hidden="true"></i>
              <span>Info</span>
            </button>
            <button id="mobileSourceBtn" type="button" class="mobile-action-button">
              <i data-lucide="quote" aria-hidden="true"></i>
              <span>Source</span>
            </button>
            <a
              id="mobileCodebookLink"
              class="mobile-action-button mobile-action-link"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              hidden
            >
              <i data-lucide="file-text" aria-hidden="true"></i>
              <span>PDF</span>
            </a>
          </div>
        </section>

        <div id="datasetSection" class="dataset-section">
          <section id="datasetPanel" class="dataset-panel" tabindex="0">
            <div class="filter-bar">
              <div class="filter-row">
                <p id="topicFilterLabel" class="field-label">Filter by topic</p>
                <div id="topicChips" class="chip-group" role="group" aria-labelledby="topicFilterLabel"></div>
              </div>
              <div class="filter-row">
                <p id="datasetFilterLabel" class="field-label">Filter by dataset</p>
                <div id="datasetTabs" class="chip-group" role="group" aria-labelledby="datasetFilterLabel"></div>
              </div>
              <p id="filterSummary" class="filter-summary" role="status" aria-live="polite"></p>
            </div>

            <p id="variableListLabel" class="field-label">Variable</p>
            <div id="variableList" class="variable-list" role="radiogroup" aria-labelledby="variableListLabel"></div>

            <button id="variableMetaBtn" type="button">Variable information</button>
            <p id="datasetCodebookWrap" class="codebook-link" hidden>
              <a id="datasetCodebookLink" href="#" target="_blank" rel="noopener noreferrer">Open codebook PDF</a>
            </p>
          </section>
        </div>

        <p id="datasetCitation" class="citation" hidden></p>


      </aside>

      <main id="map">
        <div id="mapCanvas" class="map-canvas">
          <div id="loading-indicator" aria-hidden="true"></div>
        </div>
        <div id="mapLegendDock" class="map-legend-dock" aria-label="Map legend"></div>
      </main>

      <div id="timeline-overlay">
        <div class="timeline-main">
          <div class="timeline-controls">
            <div class="playback-control">
              <button id="yearPlayBtn" type="button" class="play-button" aria-label="Play timeline">Animate</button>
              <div class="speed-button" role="group" aria-label="Timeline speed">
                <button id="speedDownBtn" type="button" aria-label="Decrease speed"><i data-lucide="chevron-left"></i></button>
                <span id="speedDisplay" aria-live="polite">1x</span>
                <button id="speedUpBtn" type="button" aria-label="Increase speed"><i data-lucide="chevron-right"></i></button>
              </div>
            </div>
          </div>
          <div class="timeline-slider-wrap" id="timelineWrap">
            <div id="timelinePreloadTrack" class="timeline-preload-track" aria-hidden="true"></div>
            <input id="yearSlider" type="range" step="1" aria-label="Year timeline" />
            <div id="timelineScale" class="timeline-scale" aria-hidden="true"></div>
            <div id="timelineSelectedMarker" class="timeline-selected-marker" aria-hidden="true">
              <div class="timeline-marker-line"></div>
              <div id="yearDisplayHero" class="timeline-year-label"></div>
            </div>
          </div>
        </div>
        <span id="yearDisplay" class="timeline-year-readout" aria-live="polite"></span>
      </div>
    </div>

    <div id="legendTooltip" class="legend-tip" role="tooltip" hidden>
      <p id="legendTooltipClass" class="legend-tip-class"></p>
      <p id="legendTooltipRange" class="legend-tip-range"></p>
      <p id="legendTooltipCount" class="legend-tip-count"></p>
    </div>

    <div id="variableTooltip" class="variable-tooltip" role="tooltip" hidden>
      <p id="variableTooltipTitle" class="variable-tooltip-title"></p>
      <p id="variableTooltipKey" class="variable-tooltip-key"></p>
      <div id="variableTooltipBody" class="variable-tooltip-body"></div>
    </div>

    <dialog id="variableMetaDialog" class="variable-meta-dialog">
      <div class="variable-meta-dialog-header">
        <h2 id="variableMetaTitle">Variable information</h2>
        <button id="variableMetaCloseBtn" type="button" class="variable-meta-close-btn">Close</button>
      </div>
      <div id="variableMetaContent" class="variable-meta-content"></div>
    </dialog>

    <dialog id="mobileVariablePickerDialog" class="mobile-picker-dialog">
      <div class="mobile-dialog-header">
        <h2>Choose variable</h2>
        <button id="mobileVariablePickerCloseBtn" type="button" class="mobile-dialog-close-btn" aria-label="Close">
          <i data-lucide="x" aria-hidden="true"></i>
        </button>
      </div>
      <input
        id="mobileVariableSearch"
        class="mobile-variable-search"
        type="search"
        autocomplete="off"
        placeholder="Search variables"
        aria-label="Search variables"
      />
      <div id="mobileTopicChips" class="mobile-topic-chips" aria-label="Filter variables by topic"></div>
      <div id="mobileVariablePickerList" class="mobile-picker-list" role="listbox" aria-label="Variables"></div>
    </dialog>

    <dialog id="mobileSourceDialog" class="mobile-source-dialog">
      <div class="mobile-dialog-header">
        <h2>Dataset source</h2>
        <button id="mobileSourceCloseBtn" type="button" class="mobile-dialog-close-btn" aria-label="Close">
          <i data-lucide="x" aria-hidden="true"></i>
        </button>
      </div>
      <p id="mobileSourceContent" class="mobile-source-content"></p>
    </dialog>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script type="module" src="./app.js"></script>
    <script>lucide.createIcons();</script>
  </body>
</html>
