<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demscore Hex Map</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/ol@10.10.0/ol.css"
      integrity="sha256-q8iv1yzBC9KcwUP0Q7rkpoBL08s/smLmtqa8bJJOo08="
      crossorigin="anonymous"
    />
    <!-- Lato is the handbook's working typeface; Open Sans carries its statistics
         and metrics. See Demscore_Handbook_Web_Style_Brief.docx. Lato ships no
         500/600/800, so a weight in between rounds up to the next one loaded. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=Open+Sans:wght@300;400;700&display=swap"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <aside id="controls">
        <h1 class="app-title">
          <img
            src="./assets/images/demscore-logo.svg"
            alt="Demscore Hex Map"
            width="200"
            height="50"
          />
        </h1>

        <section id="mobileControls" class="mobile-controls" aria-label="Mobile map controls">
          <button
            id="mobileVariablePickerBtn"
            type="button"
            class="mobile-picker-trigger"
            aria-haspopup="dialog"
            aria-expanded="false"
            aria-controls="mobileVariablePickerDialog"
          >
            <span id="mobileSelectedDataset" class="mobile-selected-dataset"></span>
            <span class="mobile-selected-copy">
              <span id="mobileSelectedTitle" class="mobile-selected-title"><span class="loading-dots" aria-hidden="true"><i></i><i></i><i></i></span></span>
              <span id="mobileSelectedMeta" class="mobile-selected-meta"></span>
            </span>
            <i data-lucide="chevron-down" aria-hidden="true"></i>
          </button>

          <div class="mobile-action-row" role="group" aria-label="Variable actions">
            <button
              id="mobileVariableInfoBtn"
              type="button"
              class="mobile-action-button"
              aria-haspopup="dialog"
              aria-expanded="false"
              aria-controls="variableTooltip"
            >
              <i data-lucide="info" aria-hidden="true"></i>
              <span>Info</span>
            </button>
          </div>
        </section>

        <div id="datasetSection" class="dataset-section">
          <!-- No tabindex: the panel is a container, everything inside it that
               can be operated is already a tab stop, and a stop on the box
               itself was one more press between the search field and the list
               with nothing to do at it. -->
          <section id="datasetPanel" class="dataset-panel" aria-label="Variable picker">
            <!-- Local only: it narrows the same list the chips narrow, over the
                 rows already in the browser, and never goes to the backend. -->
            <div class="variable-search-row">
              <input
                id="variableSearch"
                class="variable-search"
                type="search"
                autocomplete="off"
                placeholder="Search variables"
                aria-label="Search variables"
                aria-controls="variableList"
              />
            </div>

            <div class="filter-bar">
              <div class="filter-row">
                <p id="topicFilterLabel" class="field-label">Filter by topic</p>
                <div id="topicChips" class="chip-group" role="group" aria-labelledby="topicFilterLabel" aria-busy="true"><span class="loading-dots" aria-hidden="true"><i></i><i></i><i></i></span></div>
              </div>
              <div class="filter-row">
                <p id="datasetFilterLabel" class="field-label">Filter by dataset</p>
                <div id="datasetTabs" class="chip-group" role="group" aria-labelledby="datasetFilterLabel" aria-busy="true"><span class="loading-dots" aria-hidden="true"><i></i><i></i><i></i></span></div>
              </div>
              <p id="filterSummary" class="filter-summary" role="status" aria-live="polite"></p>
            </div>

            <p id="variableListLabel" class="field-label">Variable</p>
            <div id="variableList" class="variable-list" role="radiogroup" aria-labelledby="variableListLabel" aria-busy="true"><span class="loading-dots" aria-hidden="true"><i></i><i></i><i></i></span></div>
          </section>
        </div>

      </aside>

      <!-- Before the map in the source, though it is painted over it: the
           timeline is fixed to the *top* of the map pane and the legend dock is
           at its foot, so a tab order following the source used to run sidebar
           -> zoom -> legend (bottom) -> timeline (top). It is `position: fixed`
           and takes no grid cell either way, so where it sits among its
           siblings is a question of reading order and nothing else. -->
      <div id="timeline-overlay">
        <div class="timeline-main">
          <div class="timeline-controls">
            <div class="playback-control">
              <button id="yearPlayBtn" type="button" class="play-button" aria-label="Play timeline"><span>Animate</span><i data-lucide="play" aria-hidden="true"></i></button>
              <!-- The "Speed" caption floats above the reading rather than
                   sitting beside it: the multiplier stays the prominent,
                   centred thing and the word is only there so nobody reads
                   "4x" as a zoom level. Absolutely positioned, so it takes no
                   room from the row and does not move the multiplier off the
                   baseline the Animate button sits on. -->
              <div class="speed-button" role="group" aria-label="Timeline speed">
                <span class="speed-button-label" aria-hidden="true">Speed</span>
                <button id="speedDownBtn" type="button" aria-label="Decrease speed"><i data-lucide="chevron-left"></i></button>
                <span id="speedDisplay" aria-live="polite">1x</span>
                <button id="speedUpBtn" type="button" aria-label="Increase speed"><i data-lucide="chevron-right"></i></button>
              </div>
            </div>
          </div>
          <div class="timeline-slider-wrap is-awaiting-data" id="timelineWrap">
            <div id="timelinePreloadTrack" class="timeline-preload-track" aria-hidden="true"></div>
            <!-- The visible timeline is drawn around this input rather than by
                 it: the range is transparent and stretched over the whole wrap,
                 and the marker, the scale and the preload track are what is
                 seen. So the focus ring has to be drawn on the wrap instead —
                 `.timeline-slider-wrap:has(#yearSlider:focus-visible)` in
                 styles.css — and the value has to be spoken as more than a
                 number, which is what `aria-valuetext` is for
                 (DemscoreApp.refreshYearDisplay). -->
            <input id="yearSlider" type="range" step="1" aria-label="Year" />
            <div id="timelineScale" class="timeline-scale" aria-hidden="true"></div>
            <div id="timelineSelectedMarker" class="timeline-selected-marker" aria-hidden="true">
              <div class="timeline-marker-line"></div>
              <div id="yearDisplayHero" class="timeline-year-label"></div>
            </div>
          </div>
        </div>
        <!-- What the map is showing, under the year it is showing it for. The
             legend dock says the same thing at the foot of the map, which is a
             long way from the timeline on a tall window. -->
        <p id="timelineVariableTitle" class="timeline-variable-title">
          <span class="loading-dots" aria-hidden="true"><i></i><i></i><i></i></span>
        </p>
        <!-- Not a live region any more. The slider announces its own value (and
             `aria-valuetext` makes that value say how many countries the year
             covers), so a second announcement was the year twice over — and
             during an animation it was the year twice over per frame, which is
             exactly the high-frequency chatter a polite region should never
             carry. It stays as a readout for anything that wants to read the
             current year out of the DOM. -->
        <span id="yearDisplay" class="timeline-year-readout"></span>
      </div>

      <main id="map" aria-labelledby="mapRegionHeading">
        <h2 id="mapRegionHeading" class="visually-hidden">Hex map</h2>

        <!-- The map itself is a WMS image: there is nothing in it an assistive
             technology can be asked about, so the two blocks below are its
             equivalent rather than a description of it.

             `#mapSummary` is the standing reading — dataset, variable, year,
             projection, how the colours are to be read, how much of the world
             carries a value, and each class's span. It is deliberately NOT a
             live region: it is long, and it is rewritten on every year of an
             animation. `#mapAnnouncer` is the live one, and only ever holds a
             sentence. See src/controllers/MapDataController.js. -->
        <div
          id="mapSummary"
          class="visually-hidden"
          role="region"
          aria-labelledby="mapSummaryHeading"
        >
          <h3 id="mapSummaryHeading">What the map is showing</h3>
          <p id="mapSummaryText"></p>
          <ul id="mapSummaryClasses"></ul>
        </div>
        <p id="mapAnnouncer" class="visually-hidden" role="status" aria-live="polite"></p>

        <div id="mapCanvas" class="map-canvas">
          <div id="loading-indicator" aria-hidden="true"></div>
        </div>
        <!-- Spoken counterpart to the spinner, and only for loads slow enough
             to be worth interrupting a reader over. -->
        <p id="mapLoadingStatus" class="visually-hidden" role="status" aria-live="polite"></p>
        <div id="mapLegendDock" class="map-legend-dock" role="group" aria-label="Map legend"></div>
      </main>

    </div>

    <div id="legendTooltip" class="legend-tip" role="tooltip" hidden>
      <p id="legendTooltipClass" class="legend-tip-class"></p>
      <p id="legendTooltipRange" class="legend-tip-range"></p>
      <p id="legendTooltipCount" class="legend-tip-count"></p>
    </div>

    <!-- Two cards in one element. Hovering a row shows it as a `tooltip`:
         transient, tied to the pointer, nothing to operate inside it. Clicking
         an info button shows the same content as a non-modal `dialog`: it stays
         until it is dismissed, it can be read through, and it has a close
         button — so it needs a name, a focus to move into, and a focus to give
         back. `MetadataController.openVariableInfoPopover()` /
         `hideVariableTooltip()` switch the role and the close button together;
         neither may be changed without the other. -->
    <div id="variableTooltip" class="variable-tooltip" role="tooltip" aria-labelledby="variableTooltipTitle" hidden>
      <div class="variable-tooltip-head">
        <div class="variable-tooltip-head-text">
          <p id="variableTooltipTitle" class="variable-tooltip-title"></p>
          <p id="variableTooltipKey" class="variable-tooltip-key"></p>
        </div>
        <span id="variableTooltipDataset" class="variable-tooltip-dataset"></span>
        <button
          id="variableTooltipCloseBtn"
          type="button"
          class="variable-tooltip-close"
          aria-label="Close variable information"
          hidden
        >
          <i data-lucide="x" aria-hidden="true"></i>
        </button>
      </div>
      <div id="variableTooltipBody" class="variable-tooltip-body"></div>
    </div>

    <!-- The map as rows, for anyone who cannot be shown a picture of it, and
         for anyone who wants the number rather than the shade. Modal, so the
         browser handles the focus trap and Escape; see MapDataController. -->
    <dialog id="mapDataDialog" class="map-data-dialog" aria-labelledby="mapDataDialogTitle">
      <div class="mobile-dialog-header">
        <h2 id="mapDataDialogTitle">Data table</h2>
        <button id="mapDataCloseBtn" type="button" class="mobile-dialog-close-btn" aria-label="Close data table">
          <i data-lucide="x" aria-hidden="true"></i>
        </button>
      </div>
      <p id="mapDataSummary" class="map-data-summary"></p>
      <!-- Focusable on purpose, and one of the few things that should be: it
           scrolls, and a scrollable box with no tab stop cannot be scrolled
           from the keyboard at all. It has a role and a name to go with it. -->
      <div
        id="mapDataTableWrap"
        class="map-data-table-wrap"
        role="region"
        aria-labelledby="mapDataDialogTitle"
        tabindex="0"
      >
        <table class="map-data-table">
          <caption id="mapDataTableCaption" class="visually-hidden"></caption>
          <thead id="mapDataTableHead"></thead>
          <tbody id="mapDataTableBody"></tbody>
        </table>
      </div>
      <p class="map-data-footer">
        <button id="mapDataDownloadBtn" type="button" class="map-data-download">Download this table as CSV</button>
      </p>
    </dialog>

    <dialog
      id="mobileVariablePickerDialog"
      class="mobile-picker-dialog"
      aria-labelledby="mobileVariablePickerTitle"
    >
      <div class="mobile-dialog-header">
        <h2 id="mobileVariablePickerTitle">Choose variable</h2>
        <button
          id="mobileVariablePickerCloseBtn"
          type="button"
          class="mobile-dialog-close-btn"
          aria-label="Close variable picker"
        >
          <i data-lucide="x" aria-hidden="true"></i>
        </button>
      </div>
      <input
        id="mobileVariableSearch"
        class="mobile-variable-search"
        type="search"
        autocomplete="off"
        placeholder="Search variables"
        aria-label="Search variables"
      />
      <div id="mobileTopicChips" class="mobile-topic-chips" role="group" aria-label="Filter variables by topic"></div>
      <!-- A grouped list of buttons, not a listbox. It was marked up as one —
           `role="listbox"` over children with `role="option"` — without any of
           the keyboard behaviour that promise carries: no arrow keys, no
           Home/End, no typeahead, no `aria-activedescendant`. A reader was told
           to expect a select and got a stack of buttons. Buttons are what it
           is, so buttons are what it now says; the selected one carries
           `aria-current`. Implementing the full listbox pattern would be the
           other way out, but nothing here wants to mimic a native select. -->
      <div id="mobileVariablePickerList" class="mobile-picker-list" aria-label="Variables"></div>
    </dialog>

    <!-- The map is drawn in Equal Earth (EPSG:8857), which no mapping library
         carries built in; proj4 supplies the projection and OpenLayers takes it
         through ol.proj.proj4.register. See src/core/projection.js. proj4 loads
         first because that registration happens on the first map build. -->
    <script
      src="https://unpkg.com/proj4@2.22.0/dist/proj4.js"
      integrity="sha256-r332U9kepZHzPSb7lYmQu9MHGy22RKTtq6RBzJhhpHQ="
      crossorigin=""
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/ol@10.10.0/dist/ol.js"
      integrity="sha256-uJr47Dt29WTVFf0H/tPsQUrs+PM/aFt3tgdFHLDCAp8="
      crossorigin="anonymous"
    ></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script type="module" src="./app.js"></script>
    <script>lucide.createIcons();</script>
  </body>
</html>
