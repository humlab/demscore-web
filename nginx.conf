server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip_static on;
  gzip_vary on;

  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Each module's codebook, straight out of the deployment's
  # data/Demscore_Module_Vars (mounted by its compose.yml), so it is the same
  # file the import read the variable titles and credits from. Only codebook.pdf:
  # the data.csv beside it is offered through Demscore's own downloader. Not
  # immutable like /assets/: a new export replaces the file under the same URL,
  # so the browser has to ask again.
  location ~ ^/codebooks/([A-Za-z0-9_-]+)/codebook\.pdf$ {
    alias /srv/demscore-modules/$1/codebook.pdf;
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
